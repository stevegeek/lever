version: 2

before:
  hooks:
    - go mod tidy
    # Embed the guest login forwarder (linux/amd64 + arm64) so a released
    # lever needs no Go toolchain for remote access (issue #38). The test then
    # fails the release if the embed is missing or stale, rather than shipping
    # a lever that silently falls back to an apply-time cross-compile.
    - go run ./internal/provision/loginfwd/genprebuilt
    - sh -c "LEVER_REQUIRE_PREBUILT_LOGINFWD=1 go test -count=1 -run TestPrebuiltLoginForwarderEmbedded ./internal/provision/loginfwd"

builds:
  - id: lever
    main: ./cmd/lever
    binary: lever
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos: [darwin, linux]
    goarch: [amd64, arm64]

archives:
  - id: lever
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

release:
  # Keep hand-authored release notes: do not let GoReleaser generate a
  # changelog body. It attaches the built archives + checksums to the release
  # created for the tag; the prose notes are curated separately.
  draft: false
  mode: append
  disable: false

changelog:
  disable: true
