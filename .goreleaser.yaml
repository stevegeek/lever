version: 2

before:
  hooks:
    - go mod tidy
    # Build scion at the release pin (scionbin.ReleasePin) for linux/amd64 +
    # arm64 into build/scion-release/ (uploaded below), and write the manifest
    # pinning their sha256 into internal/provision/scionbin/release/, which
    # lever embeds. A released lever then downloads the binary for that pin
    # instead of building it, so the host needs no Go toolchain for scion.
    - go run ./internal/provision/scionbin/genrelease -version {{ .Version }}
    # Fail the release if the manifest is missing, names another version or
    # pin, or does not match the assets about to be uploaded.
    - sh -c "LEVER_REQUIRE_SCION_RELEASE={{ .Version }} go test -count=1 -run TestReleaseManifestEmbedded ./internal/provision/scionbin"

builds:
  - id: lever
    main: ./cmd/lever
    binary: lever
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos: [darwin, linux]
    goarch: [amd64, arm64]

  - id: lever-tool-github
    main: ./cmd/lever-tool-github
    binary: lever-tool-github
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}
    goos: [darwin, linux]
    goarch: [amd64, arm64]

  - id: lever-tool-fizzy
    main: ./cmd/lever-tool-fizzy
    binary: lever-tool-fizzy
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}
    goos: [darwin, linux]
    goarch: [amd64, arm64]

  - id: lever-tool-whisper
    main: ./cmd/lever-tool-whisper
    binary: lever-tool-whisper
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}
    goos: [darwin, linux]
    goarch: [amd64, arm64]

  - id: lever-tool-tts
    main: ./cmd/lever-tool-tts
    binary: lever-tool-tts
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}
    goos: [darwin, linux]
    goarch: [amd64, arm64]

archives:
  - id: lever
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"
  # List the prebuilt scion assets in checksums.txt too, for anyone checking
  # a download by hand. lever itself checks the digests it embeds, never
  # this file.
  extra_files:
    - glob: ./build/scion-release/scion_*_linux_*.gz

release:
  # Keep hand-authored release notes: do not let GoReleaser generate a
  # changelog body. It attaches the built archives + checksums to the release
  # created for the tag; the prose notes are curated separately.
  draft: false
  mode: append
  disable: false
  # Upload the prebuilt scion binaries next to the archives.
  extra_files:
    - glob: ./build/scion-release/scion_*_linux_*.gz

changelog:
  disable: true
