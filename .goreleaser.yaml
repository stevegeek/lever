version: 2

before:
  hooks:
    - go mod tidy
    # Build scion at the release pin (scionbin.ReleasePin) for linux/amd64 +
    # arm64, and its web UI, into build/scion-release/ (uploaded below), and
    # write the manifest pinning their sha256 into
    # internal/provision/scionbin/release/, which lever embeds. A released
    # lever then downloads the binary and the web UI for that pin instead of
    # building them, so the host needs no Go or node toolchain for scion.
    # The web UI comes prebuilt from the workflow's webui job (build/web-ui),
    # so no npm runs where the release token and lever's source are.
    - go run ./internal/provision/scionbin/genrelease -version {{ .Version }} -web-archive build/web-ui
    # Fail the release if the manifest is missing, names another version or
    # pin, or does not match the assets about to be uploaded.
    - sh -c "LEVER_REQUIRE_SCION_RELEASE={{ .Version }} go test -count=1 -run TestReleaseManifestEmbedded ./internal/provision/scionbin"

builds:
  - id: lever
    main: ./cmd/lever
    binary: lever
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos: [darwin, linux]
    goarch: [amd64, arm64]

  - id: lever-tool-github
    main: ./cmd/lever-tool-github
    binary: lever-tool-github
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}
    goos: [darwin, linux]
    goarch: [amd64, arm64]

  - id: lever-tool-fizzy
    main: ./cmd/lever-tool-fizzy
    binary: lever-tool-fizzy
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}
    goos: [darwin, linux]
    goarch: [amd64, arm64]

  - id: lever-tool-whisper
    main: ./cmd/lever-tool-whisper
    binary: lever-tool-whisper
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}
    goos: [darwin, linux]
    goarch: [amd64, arm64]

  - id: lever-tool-tts
    main: ./cmd/lever-tool-tts
    binary: lever-tool-tts
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}
    goos: [darwin, linux]
    goarch: [amd64, arm64]

archives:
  - id: lever
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"
  # List the prebuilt scion assets in checksums.txt too, for anyone checking
  # a download by hand. lever itself checks the digests it embeds, never
  # this file.
  extra_files:
    - glob: ./build/scion-release/scion_*_linux_*.gz
    - glob: ./build/scion-release/scion-web_*.tar.gz

release:
  # Keep hand-authored release notes: do not let GoReleaser generate a
  # changelog body. It attaches the built archives + checksums to the release
  # created for the tag; the prose notes are curated separately.
  draft: false
  mode: append
  disable: false
  # Upload the prebuilt scion binaries and web UI next to the archives.
  extra_files:
    - glob: ./build/scion-release/scion_*_linux_*.gz
    - glob: ./build/scion-release/scion-web_*.tar.gz

changelog:
  disable: true

# The default GITHUB_TOKEN cannot push to another repository, hence
# HOMEBREW_TAP_TOKEN, which should be able to write to the tap repo only:
# whoever can write the cask runs code on every machine that installs it.
homebrew_casks:
  - name: lever
    ids: [lever]
    repository:
      owner: stevegeek
      name: homebrew-tap
      token: '{{ index .Env "HOMEBREW_TAP_TOKEN" }}'
    skip_upload: '{{ if or (not (index .Env "HOMEBREW_TAP_TOKEN")) .Prerelease }}true{{ else }}false{{ end }}'
    commit_msg_template: "lever {{ .Tag }}"
    homepage: https://lever.to
    description: Jailed multi-agent orchestration for Claude Code
    binaries:
      - lever
      - lever-tool-github
      - lever-tool-fizzy
      - lever-tool-whisper
      - lever-tool-tts
    caveats: |
      lever starts broker tools with PATH=/usr/local/bin:/usr/bin:/bin, not
      your shell PATH. Where Homebrew's bin directory is not on it (Apple
      Silicon, Linux), name each tool by absolute path in lever.yaml, e.g.
        command: [/opt/homebrew/bin/lever-tool-github, ...]
    hooks:
      post:
        # The binaries are not notarized: without this, Gatekeeper refuses
        # to run the quarantined copies Homebrew downloads on macOS.
        install: |
          if OS.mac?
            %w[lever lever-tool-github lever-tool-fizzy lever-tool-whisper lever-tool-tts].each do |bin|
              system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/#{bin}"]
            end
          end
