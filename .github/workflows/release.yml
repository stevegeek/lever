name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  # scion's web UI build runs npm's install scripts, so it gets its own job
  # with a read-only token, no persisted credentials and no shared cache: it
  # can change only the archive it hands over, which the release job pins.
  webui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go run ./internal/provision/scionbin/genrelease -web-only -assets build/web-ui
      - uses: actions/upload-artifact@v4
        with:
          name: scion-web-ui
          path: build/web-ui/
          if-no-files-found: error
  goreleaser:
    needs: webui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # No Go cache: one written in this run (by the webui job's scripts)
      # must not feed the build of lever.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: scion-web-ui
          path: _web-ui
      - name: verify version constant matches tag
        run: |
          V="${GITHUB_REF_NAME#v}"
          grep -q "const Version = \"$V\"" internal/cli/root.go || {
            echo "internal/cli/root.go const Version does not match tag $GITHUB_REF_NAME"; exit 1; }
      - name: verify the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main"; exit 1; }
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained PAT: Contents read/write on stevegeek/homebrew-tap only.
          # Unset, .goreleaser.yaml skips the cask (#75).
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
