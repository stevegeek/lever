name: two-agents-comms
backend: orbstack
tree: workspace
scion:
  version: 65531d7f   # pin a scion commit; a lever release ships this one prebuilt
# api-key is the secure default (real key never in the container) but needs a
# Console API key; this demo opts into subscription (your Claude OAuth token).
broker:
  llm_auth: subscription
manager:
  image: lever.local/lever-claude
  prompt_file: manager.md
  allow_ports: []
workers:
  - name: producer
    dir: workers/producer
  - name: consumer
    dir: workers/consumer
